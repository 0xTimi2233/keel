name: Bug report
description: 报告一个缺陷，帮助定位与修复
title: "[Bug] "
labels:
  - bug
  - needs-triage
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从初始状态写起，每步一行，务必可复现
      placeholder: |
        1. 打开 xxx
        2. 执行 xxx
        3. 观察 xxx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你认为应该发生什么
      placeholder: 应该……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么，附报错信息或截图
      placeholder: 结果……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      description: 浏览器、系统、版本、部署环境
      placeholder: 例如 Chrome 120 / macOS 14
