name: Bug report
description: 报告一个缺陷，帮助定位与修复
labels:
  - type:bug
  - stage:needs-triage
body:
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从初始状态写起，每步一行，务必可复现
      placeholder: |
        1. 打开 xxx
        2. 执行 xxx
        3. 观察 xxx
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你认为应该发生什么
      placeholder: 应该……
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      description: 实际发生了什么，附报错信息或截图
      placeholder: 结果……
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 填写操作系统与应用版本，不适用可留空
      value: |
        - macOS Version: [e.g. 26.4.1]
        - App Version: [e.g. 1.2.3]
